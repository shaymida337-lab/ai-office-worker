name: Invoice Quality Safety Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  invoice-quality:
    name: Invoice Quality Benchmark Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w backend

      - name: Run Invoice Quality Benchmark Gate
        run: npm run test:invoice-quality

      - name: Run Canonical 20-Document Invoice Golden Runner
        run: npx tsx backend/scripts/run-invoice-golden.ts
